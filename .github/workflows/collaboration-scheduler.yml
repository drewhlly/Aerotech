name: Collaboration scheduler
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions: {}
concurrency:
  group: collaboration-scheduler
  cancel-in-progress: false
jobs:
  run:
    # Enable only after staging verification, migration and provider configuration.
    if: vars.COLLABORATION_SCHEDULER_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Run authenticated collaboration worker
        env:
          COLLABORATION_CRON_URL: ${{ vars.COLLABORATION_CRON_URL }}
          CRON_SECRET: ${{ secrets.COLLABORATION_CRON_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${COLLABORATION_CRON_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "Configure COLLABORATION_CRON_URL and COLLABORATION_CRON_SECRET before enabling this job."
            exit 1
          fi
          case "$COLLABORATION_CRON_URL" in
            https://*/api/cron/collaboration) ;;
            *) echo "The scheduler URL must be an HTTPS collaboration endpoint."; exit 1 ;;
          esac
          curl --fail --show-error --silent --max-time 70 --retry 2 --retry-delay 5 \
            --header "Authorization: Bearer $CRON_SECRET" "$COLLABORATION_CRON_URL"
