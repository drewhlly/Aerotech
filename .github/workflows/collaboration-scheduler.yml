name: Collaboration scheduler
on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths: [".github/workflows/collaboration-scheduler.yml"]
  workflow_dispatch:
permissions: {}
concurrency:
  group: collaboration-scheduler
  cancel-in-progress: false
jobs:
  run:
    if: github.repository == 'drewhlly/Aerotech' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Run worker with short-lived GitHub identity
        shell: bash
        run: |
          node --input-type=module <<'JS'
          const endpoint='https://aerotech-psi.vercel.app/api/cron/collaboration';
          const url=new URL(process.env.ACTIONS_ID_TOKEN_REQUEST_URL);
          url.searchParams.set('audience',endpoint);
          const r=await fetch(url,{headers:{Authorization:'Bearer '+process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN},signal:AbortSignal.timeout(15000)});
          if(!r.ok)throw Error('Identity request failed: '+r.status);
          const {value}=await r.json();if(!value)throw Error('Identity token missing');
          const response=await fetch(endpoint,{headers:{Authorization:'Bearer '+value},signal:AbortSignal.timeout(70000)});
          if(!response.ok)throw Error('Scheduler failed: '+response.status);
          const result=await response.json();console.log(JSON.stringify({processed:result.processed,failed:result.failed}));
          if(result.failed)throw Error('Background jobs failed; inspect the queue');
          JS
