name: Cloudflare migration compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - 'src/**'
      - 'pages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - '.github/workflows/cloudflare-migration-check.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current Aerotech
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Configure Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install existing dependencies
        run: npm ci --no-audit --no-fund
      - name: Check current Next.js compatibility with Cloudflare vinext
        run: npx --yes vinext check
      - name: Build the existing application
        run: npm run build
