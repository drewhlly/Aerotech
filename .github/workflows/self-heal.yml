name: Self-heal (bounded mechanical repairs)

# Automatically proposes conservative ESLint repairs.
# This workflow NEVER merges or deploys changes.
on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [Aerotech CI]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: safe-repair
  cancel-in-progress: false

jobs:
  propose-safe-repair:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply mechanical ESLint fixes to allowlisted UI folders only
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          allowed=(components/ui src/components/ui app/components/ui src/app/components/ui)
          existing=()
          for dir in "${allowed[@]}"; do
            [[ ! -d "$dir" ]] || existing+=("$dir")
          done
          if [[ ${#existing[@]} -eq 0 ]]; then
            echo "No allowlisted UI directories found; nothing to repair." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # ESLint may report remaining issues; those will be caught by the
          # mandatory full-project verification if an autofix is proposed.
          npx eslint "${existing[@]}" --fix || true
      - name: Limit changes to safe presentation files
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only > /tmp/aerotech-fixed-files.txt
          if [[ ! -s /tmp/aerotech-fixed-files.txt ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No mechanical repairs are available." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Do not propose changes to business logic, auth, billing, payroll,
          # databases, deployment settings, scripts, or other sensitive paths.
          while IFS= read -r path; do
            if [[ ! "$path" =~ ^(components/ui/|src/components/ui/|app/components/ui/|src/app/components/ui/) ]]; then
              echo "Non-allowlisted file changed: $path; discarding all proposed changes."
              git restore --worktree -- .
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done < /tmp/aerotech-fixed-files.txt
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Verify lint, tests, build, and types
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run lint
          npm test
          npm run test:integration
          npm run build
          npx tsc --noEmit
      - name: Open a reviewable repair pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="automation/eslint-fixes-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add -u
          if git diff --cached --quiet; then
            echo "No eligible fixes to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "fix: apply verified ESLint autofixes to UI components"
          # Scope the token to this explicit push; never save it in git config.
          git -c http.extraheader="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin "$branch"
          gh pr create --base main --head "$branch" --label needs-approval \
            --title "fix: verified safe UI lint repairs" \
            --body "Automatically proposed mechanical ESLint fixes restricted to UI components. Lint, smoke tests, integration tests, production build, and type-check all passed in this workflow. **Human review required. This workflow does not merge or deploy.**"
