name: Deploy Cloudflare staging
on:
  workflow_dispatch:
  push:
    branches: [infra/cloudflare-staging-20261030]
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: cloudflare-staging
    timeout-minutes: 30
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      PAYSTACK_SECRET_KEY: ${{ secrets.STAGING_PAYSTACK_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require isolated deployment credentials
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing Cloudflare account ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing Cloudflare API token'; exit 1; }
          test -n "$DATABASE_URL" || { echo 'Missing isolated staging database'; exit 1; }
          case "$DATABASE_URL" in */aerotech_staging\?*|*/aerotech_staging) ;; *) echo 'Expected isolated staging database'; exit 1;; esac
          test -z "$PAYSTACK_SECRET_KEY" || { case "$PAYSTACK_SECRET_KEY" in sk_test_*) ;; *) echo 'Only Paystack test credentials allowed'; exit 1;; esac; }
      - name: Install dependencies
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Validate staging migration ledger
        run: npm run db:migrate
      - name: Build and bundle Worker
        run: npm run cf:build
      - name: Deploy only to workers.dev staging Worker
        run: npx wrangler deploy -c wrangler.aerotech-staging.toml

      - name: Install database URL as encrypted Worker secret
        shell: bash
        run: printf '%s' "$DATABASE_URL" | npx wrangler secret put DATABASE_URL --name aerotech-staging
      - name: Configure test-only billing secret if provided
        if: env.PAYSTACK_SECRET_KEY != ''
        shell: bash
        run: printf '%s' "$PAYSTACK_SECRET_KEY" | npx wrangler secret put PAYSTACK_SECRET_KEY --name aerotech-staging
      - name: Verify staging Worker exists and is reachable
        shell: bash
        run: |
          npx wrangler deployments list --name aerotech-staging

      - name: Smoke test deployed staging homepage
        shell: bash
        run: |
          url='https://aerotech-staging.aerotechhr-staging.workers.dev/'
          code=$(curl --location --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$url")
          echo "Staging homepage HTTP status: $code"
          test "$code" = 200

      - name: Verify public pages and protected routes
        shell: bash
        run: |
          set -euo pipefail
          base='https://aerotech-staging.aerotechhr-staging.workers.dev'
          for route in / /careers /pricing /about; do
            status=$(curl --location --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$base$route")
            echo "Public route $route: HTTP $status"
            test "$status" = 200
          done
          for route in /dashboard/employer /dashboard/employee /dashboard/applicant /api/employees; do
            status=$(curl --silent --output /dev/null --write-out '%{http_code}' --max-time 30 "$base$route")
            echo "Protected route $route (anonymous): HTTP $status"
            case "$status" in 301|302|303|307|308|401|403) ;; *) echo 'Unexpected anonymous access response'; exit 1 ;; esac
          done
