name: Weekly benchmark evidence
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Publish research checklist (not a completed benchmark)
        run: cat docs/COMPETITIVE_BENCHMARK.md >> "$GITHUB_STEP_SUMMARY"
