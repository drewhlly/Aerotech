name: Full meetings secret history audit
on:
  pull_request:
    paths: ['.github/workflows/meetings-history-audit.yml','scripts/scan-meetings-history.mjs']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Fetch all branch and tag refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' '+refs/tags/*:refs/tags/*'
      - name: Install pinned scanner with published checksum
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt -o /tmp/checksums.txt
          expected=$(awk '$2=="gitleaks_8.30.1_linux_x64.tar.gz" {print $1}' /tmp/checksums.txt)
          test -n "$expected"
          printf '%s  /tmp/gitleaks.tar.gz\n' "$expected" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan all reachable history and report metadata only
        run: node scripts/scan-meetings-history.mjs /tmp/gitleaks
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: meetings-history-metadata-only
          path: /tmp/aerotech-history-metadata.json
          retention-days: 7
