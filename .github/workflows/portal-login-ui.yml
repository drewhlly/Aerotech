name: Portal login UI verification
on:
  pull_request:
    paths:
      - 'src/components/login-form.tsx'
      - 'src/components/auth/**'
      - 'src/app/globals.css'
      - 'scripts/verify-portal-login-ui.mjs'
      - '.github/workflows/portal-login-ui.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portal-login:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/verify-portal-login-ui.mjs
