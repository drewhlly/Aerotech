name: Tier 1 auto-merge guard
on:
  pull_request_target:
    types: [labeled, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  guarded-auto-merge:
    if: github.event_name == 'pull_request_target' && contains(github.event.pull_request.labels.*.name, 'tier1-auto') && !contains(github.event.pull_request.labels.*.name, 'needs-approval') && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      # No checkout and no PR code execution in this privileged workflow.
      - name: Fail closed unless protection and safe paths are verified
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$REPO/branches/main/protection" > /tmp/protection.json
          jq -e '.enforce_admins.enabled == true and .allow_force_pushes.enabled == false and .required_pull_request_reviews.required_approving_review_count >= 1 and .required_status_checks.strict == true and (.required_status_checks.contexts | length >= 4)' /tmp/protection.json > /dev/null
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' > /tmp/paths
          test -s /tmp/paths
          while IFS= read -r path; do
            # Deliberately narrow: no scripts, workflows, auth, payroll or privacy.
            [[ "$path" =~ ^src/components/ui/[a-zA-Z0-9_-]+\.css$ || "$path" =~ ^docs/maintenance/[a-zA-Z0-9_-]+\.md$ ]] || exit 1
          done < /tmp/paths
          gh pr merge "$PR" --repo "$REPO" --auto --squash
