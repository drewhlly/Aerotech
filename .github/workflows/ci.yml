name: Aerotech CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:00 Africa/Lagos (UTC+1) daily; GitHub may delay scheduled starts.
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Run smoke tests
        run: npm test
      - name: Verify all workflow integration suites
        run: npm run test:integration
      - name: Build production app
        run: npm run build
      - name: Type-check
        run: npx tsc --noEmit

  cloudflare-staging:
    if: github.event_name == 'pull_request' && github.head_ref == 'infra/cloudflare-vinext-deploy-20261109'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      CI: "1"
      CLOUDFLARE_ACCOUNT_ID: 3144bf081a43f5ca5bc88b60e956a9ce
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Initialize vinext for staging
        run: npx --yes vinext init --platform=cloudflare --name=aerotech-vinext-staging --cdn-cache=none --data-cache=none --image-optimization=none
      - name: Build Cloudflare Worker
        run: npm run build:vinext
      - name: Verify deployment credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN Actions secret"; exit 1; }
      - name: Deploy isolated staging Worker
        run: npx @vinext/cloudflare deploy
