name: Aerotech CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Run smoke tests
        run: npm test
      - name: Verify subscription billing and capacity
        run: npm run test:billing
      - name: Verify isolated payout connection and transfer safety
        run: npm run test:payouts
      - name: Verify event expiry and active reminders
        run: npm run test:events
      - name: Build production app
        run: npm run build
      - name: Type-check
        run: npx tsc --noEmit
