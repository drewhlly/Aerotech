# Cloudflare staging only. Do not attach aerotechhr.app or production routes.
name = "aerotech-staging"
main = ".open-next/worker.js"
compatibility_date = "2026-10-30"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true
